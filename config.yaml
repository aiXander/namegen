ai_settings:
  max_names: 750
filtering:
  exclude_training_words: true
  min_edit_distance: 1
  remove_duplicates: true
generation:
  ends_with: a
  excludes: ''
  includes: ''
  max_length: 11
  max_time_per_name: 3
  min_length: 5
  n_words: 5000
  regex_pattern: ''
  starts_with: ''
  word_counts:
  - 1
  - 2
llm:
  available_models:
  - anthropic/claude-haiku-5.5
  - openai/gpt-6-luna
  - deepseek/deepseek-v4.1-flash
  - google/gemini-3.5-flash-lite
  - moonshotai/kimi-k3
  - anthropic/claude-sonnet-5.5
  - openai/gpt-6-sol
  - anthropic/claude-opus-5.5
  chunk_size: 20
  description: We are going to evaluate names for an AI agent that acts as the collective
    mind for communities and organizations. This agent will embody the collective
    consciousness of the group, act as echochamber, brainstorming partner, matchmaker,
    collective memory and coordination agent for teams, communities, neighbourhoods,
    events, festivals and decentralized organisations. The name should feel welcoming,
    organic, but also grounded and present. Ideally, the name has some hints as to
    its purpose.
  embedding_model: openai/text-embedding-3-large
  final_model: anthropic/claude-sonnet-5.5
  final_size: 30
  guidance: ''
  judges:
  - anthropic/claude-haiku-5.5
  - openai/gpt-6-luna
  keywords: murmuration, community, collective, swarm, gigabrain, mycelium, colony,
    hive, flock
  min_similarity: 0
model:
  backoff: true
  order: 3
  temperature: 1
output:
  format: list
  output_file: generated_names.txt
  save_to_file: false
  sort_ascending: true
  sort_by: length
saved_ratings:
  aurick: 4
  auton: 3
  tenna: 3
